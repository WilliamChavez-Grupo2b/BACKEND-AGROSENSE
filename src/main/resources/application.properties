spring.application.name=agrosense
server.port=${PORT:9000}

# A local datasource.properties file may supply database settings. Environment variables such as
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD can be used instead.
# DATABASE_DIR overrides the local config file location when the app is not started from this folder.
agrosense.database.dir=${DATABASE_DIR:../database}
spring.config.import=optional:file:${DATABASE_DIR:../database}/datasource.properties
# Without that file (the Docker image has none) the connection comes from the environment: either Spring's
# own SPRING_DATASOURCE_* variables, which win, or the DATABASE_* names the file itself reads.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Tokens are signed with this secret. It has no default: set JWT_SECRET to a random value of at least
# 64 bytes (for example the output of "openssl rand -base64 64"). The application refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Failed logins allowed for one account, and from one network address, before further attempts are
# refused with 429 for login.lock-minutes. 0 turns a limit off. Behind a reverse proxy every client
# shares the proxy's address: set server.forward-headers-strategy=native there, or turn the address limit off.
login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
login.max-attempts-per-address=${LOGIN_MAX_ATTEMPTS_PER_ADDRESS:20}
login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# How often open WebSocket sessions are checked; those whose token expired or whose account was
# disabled are closed.
websocket.session-check-ms=${WEBSOCKET_SESSION_CHECK_MS:15000}

# MQTT ingestion of sensor readings. Off unless MQTT_ENABLED=true.
# Devices publish JSON like {"code":"AS-001","value":52.3,"unit":"%","timestamp":1790000000000}.
# The "+" level of mqtt.topic is the sensor code: a message is only accepted when its "code" matches
# the topic it arrived on, so give each device publish rights on its own topic only (broker ACL).
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:agrosense-backend}
mqtt.topic=${MQTT_TOPIC:agrosense/sensors/+/readings}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# Password given to the sample user when the "seed" profile is active (SPRING_PROFILES_ACTIVE=seed).
agrosense.seed.password=${SEED_USER_PASSWORD:}

# Irrigation predictions (the IA-AGROSENSE service). Off until AI_SERVICE_URL is set. AI_SERVICE_TOKEN is
# the secret that service asks for, when it asks for one; it has no default and is never written here.
ai.service.url=${AI_SERVICE_URL:}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.irrigation-path=${AI_IRRIGATION_PATH:/predict/irrigation}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:5000}
ai.service.max-attempts=${AI_SERVICE_MAX_ATTEMPTS:1}

# Demo administrator with one estate, one crop and four sensors, created at startup. Off unless
# DEMO_DATA_ENABLED=true, and then DEMO_PASSWORD is required: the password has no default on purpose.
app.demo.enabled=${DEMO_DATA_ENABLED:false}
app.demo.email=${DEMO_EMAIL:admin@agrosense.io}
app.demo.password=${DEMO_PASSWORD:}

# Conversational assistant (Google Gemini). Off until GEMINI_API_KEY is set: the key has no default and is
# never written in this file. GEMINI_MODEL defaults to the alias of the newest Flash model, because fixed
# names are retired over time (gemini-1.5-flash stopped answering in September 2025).
# Instead of Gemini, any provider that speaks the OpenAI API (Groq, OpenRouter, Mistral, OpenAI...) can
# answer: set AI_CHAT_API_KEY and it is used. The defaults are Groq's address and models; AI_CHAT_BASE_URL,
# AI_CHAT_MODEL and AI_TRANSCRIPTION_MODEL change them. An empty AI_TRANSCRIPTION_MODEL is for a provider
# that cannot turn recordings into text: voice messages then ask the user to write instead. Providers
# retire model names: GET <base address>/models lists the ones a key can use. A model that "reasons"
# before answering spends the answer's token allowance on that and may cut the answer short.
ai.chat.api-key=${AI_CHAT_API_KEY:}
ai.chat.base-url=${AI_CHAT_BASE_URL:https://api.groq.com/openai/v1}
ai.chat.model=${AI_CHAT_MODEL:qwen/qwen3.8-27b}
ai.chat.transcription-model=${AI_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}
# Questions one user may ask per minute; 0 turns the limit off.
ai.assistant.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
# While the model is not configured or does not respond, written questions are answered from the farm's own
# figures instead of being refused. false turns that off.
ai.assistant.local-answers=${AI_LOCAL_ANSWERS:true}
# A voice message is a few hundred kilobytes; the assistant itself refuses more than 3 MB.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
