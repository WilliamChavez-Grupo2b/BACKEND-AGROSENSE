spring.application.name=agrosense
server.port=${PORT:9000}

# Everything about the database (connection, schema, sample data) is configured in the workspace's
# /database folder. DATABASE_DIR overrides its location when the app is not started from this folder.
agrosense.database.dir=${DATABASE_DIR:../../database}
spring.config.import=file:${DATABASE_DIR:../../database}/datasource.properties

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Password given to the sample user when the "seed" profile is active (SPRING_PROFILES_ACTIVE=seed).
agrosense.seed.password=${SEED_USER_PASSWORD:}

ai.service.url=${AI_SERVICE_URL:}
ai.service.irrigation-path=${AI_IRRIGATION_PATH:/predict/irrigation}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:5000}
