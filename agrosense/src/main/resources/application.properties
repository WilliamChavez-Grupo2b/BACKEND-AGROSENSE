spring.application.name=agrosense
server.port=${PORT:9000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agrosense_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# No default on purpose: credentials must come from the environment, never from this file.
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "validate" never changes the schema. The "seed" profile switches to "update" for local development.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Sample data, only loaded with the "seed" profile (SPRING_PROFILES_ACTIVE=seed).
agrosense.seed.email=${SEED_USER_EMAIL:demo@agrosense.co}
agrosense.seed.password=${SEED_USER_PASSWORD:}

ai.service.url=${AI_SERVICE_URL:}
ai.service.irrigation-path=${AI_IRRIGATION_PATH:/predict/irrigation}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:5000}