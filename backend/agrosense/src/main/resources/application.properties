spring.application.name=agrosense
server.port=${PORT:9000}

# Everything about the database (connection, schema, sample data) is configured in the workspace's
# /database folder. DATABASE_DIR overrides its location when the app is not started from this folder.
agrosense.database.dir=${DATABASE_DIR:../../database}
spring.config.import=file:${DATABASE_DIR:../../database}/datasource.properties

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Tokens are signed with this secret. It has no default: set JWT_SECRET to a random value of at least
# 64 bytes (for example the output of "openssl rand -base64 64"). The application refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Failed logins allowed for one account, and from one network address, before further attempts are
# refused with 429 for login.lock-minutes. 0 turns a limit off. Behind a reverse proxy every client
# shares the proxy's address: set server.forward-headers-strategy=native there, or turn the address limit off.
login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
login.max-attempts-per-address=${LOGIN_MAX_ATTEMPTS_PER_ADDRESS:20}
login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# How often open WebSocket sessions are checked; those whose token expired or whose account was
# disabled are closed.
websocket.session-check-ms=${WEBSOCKET_SESSION_CHECK_MS:15000}

# MQTT ingestion of sensor readings. Off unless MQTT_ENABLED=true.
# Devices publish JSON like {"code":"AS-001","value":52.3,"unit":"%","timestamp":1790000000000}.
# The "+" level of mqtt.topic is the sensor code: a message is only accepted when its "code" matches
# the topic it arrived on, so give each device publish rights on its own topic only (broker ACL).
mqtt.enabled=${MQTT_ENABLED:false}
# MQTT is the older way in; field devices now send their events to the event service (event-service/),
# which forwards them to POST /api/internal/events. This code stays, off unless MQTT_ENABLED=true.
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:agrosense-backend}
mqtt.topic=${MQTT_TOPIC:agrosense/sensors/+/readings}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# Live events from field devices (the event service, event-service/). EVENTS_INTERNAL_KEY is the key the
# event service sends as X-Internal-Key to POST /api/internal/events; without it that route refuses every
# call. EVENTS_STREAM_SECRET (at least 32 bytes, shared with the event service only) signs the 5-minute
# tokens of GET /api/events/token that open a user's live stream; without it that route answers 503.
events.internal-key=${EVENTS_INTERNAL_KEY:}
events.stream-secret=${EVENTS_STREAM_SECRET:}

# The ESP32 as a TCP server on its own Wi-Fi network: the backend connects to ESP32_TCP_HOST:ESP32_TCP_PORT and reads
# one reading per line. Off unless ESP32_TCP_ENABLED=true; leave it off on Render, which cannot reach that network.
# The connection has no key: the readings belong to the device ESP32_DEVICE_ID because this setting says so.
esp32.tcp.enabled=${ESP32_TCP_ENABLED:false}
esp32.tcp.host=${ESP32_TCP_HOST:192.168.4.1}
esp32.tcp.port=${ESP32_TCP_PORT:8080}
esp32.device-id=${ESP32_DEVICE_ID:RPI-DEMO-01}
esp32.tcp.connect-timeout-ms=5000
esp32.tcp.read-timeout-ms=120000
esp32.tcp.first-retry-ms=2000
esp32.tcp.longest-retry-ms=30000

# Password given to the sample user when the "seed" profile is active (SPRING_PROFILES_ACTIVE=seed).
agrosense.seed.password=${SEED_USER_PASSWORD:}
# Key given at start-up to the demo device that seed_demo.sql creates (RPI-DEMO-01), whatever the profile.
# Only for local and test databases; leave it unset in production.
agrosense.seed.device-key=${SEED_DEVICE_KEY:}

# The AI service (IA-AGROSENSE): irrigation predictions, and the assistant when AI_CHAT_VIA_SERVICE=true.
# Off until AI_SERVICE_URL is set. AI_SERVICE_KEY is sent as X-Internal-Key (the service's INTERNAL_API_KEY);
# AI_SERVICE_TOKEN is the bearer token sent before, still accepted by the service while both move to the key.
# Neither has a default and they are never written here. A free host puts the service to sleep, and the
# first call after a while waits for it to start: AI_SERVICE_TIMEOUT_MS gives it 30 seconds by default.
ai.service.url=${AI_SERVICE_URL:}
ai.service.key=${AI_SERVICE_KEY:}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.irrigation-path=${AI_IRRIGATION_PATH:/predict/irrigation}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}
ai.service.max-attempts=${AI_SERVICE_MAX_ATTEMPTS:1}

# The assistant goes through the AI service only with AI_CHAT_VIA_SERVICE=true (and AI_SERVICE_URL set), so
# turning predictions on does not move the chat to another provider. Off, it answers with the providers
# below, which are the assistant's own and are kept as the fallback of a backend without that service.
ai.chat.via-service=${AI_CHAT_VIA_SERVICE:false}
# Conversational assistant (Google Gemini). Off until GEMINI_API_KEY is set: the key has no default and is
# never written in this file. GEMINI_MODEL defaults to the alias of the newest Flash model, because fixed
# names are retired over time (gemini-1.5-flash stopped answering in September 2025).
# Instead of Gemini, any provider that speaks the OpenAI API (Groq, OpenRouter, Mistral, OpenAI...) can
# answer: set AI_CHAT_API_KEY and it is used. The defaults are Groq's address and models; AI_CHAT_BASE_URL,
# AI_CHAT_MODEL and AI_TRANSCRIPTION_MODEL change them. AI_CHAT_MODEL may list several models separated by
# commas: when the first is out of allowance or no longer exists, the next one answers (providers limit
# each model on its own). An empty AI_TRANSCRIPTION_MODEL is for a provider
# that cannot turn recordings into text: voice messages then ask the user to write instead. Providers
# retire model names: GET <base address>/models lists the ones a key can use. A model that "reasons"
# before answering spends the answer's token allowance on that and may cut the answer short.
ai.chat.api-key=${AI_CHAT_API_KEY:}
ai.chat.base-url=${AI_CHAT_BASE_URL:https://api.groq.com/openai/v1}
ai.chat.model=${AI_CHAT_MODEL:qwen/qwen3.8-27b}
ai.chat.transcription-model=${AI_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
# Claude (Anthropic), when there is no AI_CHAT_API_KEY: set ANTHROPIC_API_KEY and it answers before Gemini.
# ANTHROPIC_MODEL is claude-haiku-5-5 by default (claude-sonnet-5-5 answers better, at a higher price).
# Claude does not transcribe recordings: voice messages arrive as the browser's text or are asked in writing.
# ANTHROPIC_EFFORT is how much the model thinks before answering; empty for a model without that setting.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
anthropic.effort=${ANTHROPIC_EFFORT:low}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}
# The longest answer, in tokens, whichever provider answers.
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
# Questions one user may ask per minute; 0 turns the limit off.
ai.assistant.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
# While the model is not configured or does not respond, written questions are answered from the farm's own
# figures instead of being refused. false turns that off: the question is then answered with a 503.
ai.assistant.local-answers=${AI_LOCAL_ANSWERS:true}
# A voice message is a few hundred kilobytes; the assistant itself refuses more than 3 MB.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Corrections per sensor type, TYPE=offset:gain, for example PH=0.1:1.02,SOIL_MOISTURE=-1.5:1.
sensor.calibration=${SENSOR_CALIBRATION:}
# How often a crop with a device gets a new irrigation prediction; 0 turns it off.
ai.ingestion.prediction-minutes=${AI_INGESTION_PREDICTION_MINUTES:30}
# A device that reported before and is silent this long raises SENSOR_OFFLINE; 0 turns it off.
alerts.device-silent-minutes=${ALERTS_DEVICE_SILENT_MINUTES:15}
# Reads the forecast of every estate with coordinates each hour and raises FROST_RISK.
alerts.frost-watch=${ALERTS_FROST_WATCH:true}
weather.base-url=${WEATHER_BASE_URL:https://api.open-meteo.com}
# simulated records the irrigation; relay also sends the order to the crop's device.
irrigation.actuator=${IRRIGATION_ACTUATOR:simulated}
# With the relay, the longest run: it must match MAX_PUMP_ON_MS in the firmware.
irrigation.max-run-minutes=${IRRIGATION_MAX_RUN_MINUTES:5}
# Lets a confident prediction start an irrigation with nobody confirming it.
irrigation.ai-orders=${IRRIGATION_AI_ORDERS:false}
# Events accepted per device and minute; beyond it the device gets a 429 and retries. 0 turns it off.
devices.max-events-per-minute=${DEVICE_MAX_EVENTS_PER_MINUTE:60}
# Identical readings at 0 or 100 % in a row before SENSOR_FAULT; 0 turns it off.
alerts.stuck-readings=${ALERTS_STUCK_READINGS:10}
# Days of raw readings to keep; older ones become hourly summaries and are DELETED. 0 keeps everything.
readings.retention-days=${READINGS_RETENTION_DAYS:0}
